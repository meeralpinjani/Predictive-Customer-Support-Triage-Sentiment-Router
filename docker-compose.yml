# One command for judges:  docker compose up --build
# Dashboard: http://localhost:5173   API docs: http://localhost:8000/docs
# Demo account passwords are generated on first start: docker compose exec backend cat demo_accounts.local.json
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-change-me-for-anything-public}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - triage-data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  triage-data:
